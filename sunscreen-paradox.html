*{box-sizing:border-box}
.wrap{
  --ink:${$.ink};
  background:${$.bg};
  color:${$.ink};
  font-family:${wt};
  font-size:17px;
  line-height:1.62;
  padding:0 20px 64px;
  max-width:760px;
  margin:0 auto;
}
.mono{font-family:${ln}}

h1,h2{font-family:${wt};font-weight:600;letter-spacing:-0.015em;color:${$.ink};text-wrap:balance}
h1{font-size:clamp(2.05rem,6.8vw,2.9rem);line-height:1.06;letter-spacing:-0.025em;margin:.1em 0 .35em}
h2{font-size:1.34rem;margin:0 0 .5em}
p{margin:0 0 1.05em;max-width:62ch}
em,i{font-style:italic}
b{font-weight:600}

/* hero */
.hero{position:relative;padding:52px 0 26px}
.glow{
  position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:min(560px,92vw);height:300px;pointer-events:none;
  background:
    radial-gradient(closest-side at 40% 40%, ${$.uv}22, transparent 70%),
    radial-gradient(closest-side at 66% 52%, ${$.gold}22, transparent 70%);
  filter:blur(4px);
}
.eyebrow{
  position:relative;font-family:${ln};font-size:.72rem;
  letter-spacing:.22em;text-transform:uppercase;color:${$.uv};margin:0 0 .2em
}
.lede{position:relative;font-size:1.15rem;line-height:1.55;color:${$.ink}}

/* blocks */
.block{padding:26px 0 8px}
.sub,.sub *{color:${$.mut}}
.sub{font-size:.98rem}

/* variables */
.vars,.named{list-style:none;padding:0;margin:.2em 0 0;max-width:62ch}
.vars li,.named li{
  padding:11px 0 11px 20px;position:relative;margin:0
}
.vars li::before,.named li::before{
  content:"";position:absolute;left:0;top:1.15em;width:8px;height:8px;
  border-radius:50%;background:${$.uv}
}
.named li{padding-top:13px;padding-bottom:13px}

/* dag */
.dagwrap{margin:6px 0 18px}
.dag{width:100%;max-width:340px;display:block;margin:0 auto}
.node{font-family:${wt};font-size:12px;font-weight:600}
.edgelab{font-family:${ln};font-size:15px;fill:${$.mut};text-anchor:middle}
.edgelab.sm{font-size:11px}
.dagcap{text-align:center;color:${$.mut};font-size:.9rem;margin:.4em 0 0}

/* segmented control */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.segbtn{
  flex:1 1 auto;min-width:132px;display:flex;align-items:center;gap:8px;
  font-family:${wt};font-size:.9rem;font-weight:500;
  color:${$.mut};background:${$.white};border:1.5px solid ${$.grid};
  border-radius:11px;padding:9px 12px;cursor:pointer;transition:all .15s
}
.segbtn:hover{border-color:${$.uv}66;color:${$.ink}}
.segbtn.on{background:${$.uv};border-color:${$.uv};color:#fff}
.segnum{
  font-family:${ln};font-size:.72rem;width:20px;height:20px;
  display:grid;place-items:center;border-radius:50%;
  background:${$.uvSoft};color:${$.uv};flex:0 0 auto
}
.segbtn.on .segnum{background:#ffffff33;color:#fff}

/* chart */
.chartcard{background:${$.card};border-radius:16px;padding:16px 12px 14px}
.chartwrap{width:100%;height:360px}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:${$.mut};font-family:${wt}}
.chip .dot{width:10px;height:10px;border-radius:50%}
.caption{font-size:1rem;color:${$.ink};margin:12px 6px 2px;max-width:none}
.caption em{color:${$.uv};font-style:normal;font-weight:600}
.tip{background:${$.ink};color:#fff;border-radius:8px;padding:7px 10px;font-size:.78rem;font-family:${ln};line-height:1.5}
.tipk{color:${$.neutral};margin-right:6px}

/* slider */
.slidercard{background:${$.white};border-radius:16px;padding:16px 18px;margin-top:14px}
.sliderhead{display:flex;justify-content:space-between;align-items:baseline}
.sliderhead label{font-family:${wt};font-weight:600;font-size:1rem}
.big{font-size:1.35rem;color:${$.uv}}
input[type=range]{width:100%;margin:14px 0 8px;accent-color:${$.uv};height:22px}
.sliderfoot{display:flex;flex-direction:column;gap:2px;font-size:.92rem;color:${$.mut}}

/* formula + stats */
.formula{font-family:${ln};font-size:1.05rem;color:${$.ink};background:${$.uvSoft};display:inline-block;padding:8px 14px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px}
.statbox{background:${$.white};border-radius:12px;padding:12px 8px;text-align:center}
.statbox.hot{background:${$.uvSoft};outline:1.5px solid ${$.uv}}
.statval{font-size:1.3rem;color:${$.ink}}
.statlab{font-family:${ln};font-size:.72rem;color:${$.mut};margin-top:2px}
.statsub{font-size:.68rem;color:${$.faint};margin-top:3px;font-family:${wt}}

.realnote{background:${$.card};border-radius:12px;padding:14px 16px;font-size:.98rem;color:${$.ink};max-width:none}

/* reading the graph */
h3{font-family:${wt};font-weight:600;font-size:1.05rem;letter-spacing:-.01em;margin:26px 0 .45em;color:${$.ink}}
.dagwrap.card{background:${$.white};border-radius:16px;padding:18px 16px 6px;margin:2px 0 20px}
.dagwrap.card .dag{max-width:400px}
.boxlab{font-family:${wt};font-size:9.5px;font-weight:600;fill:${$.ink};letter-spacing:.04em;text-transform:uppercase}
.dagnote{color:${$.ink};font-size:.97rem;line-height:1.58;margin:14px 4px 12px;max-width:60ch;margin-left:auto;margin-right:auto}
.inlinebtn{
  font-family:${wt};font-size:.86rem;font-weight:600;
  background:${$.uv};color:#fff;border:none;border-radius:999px;
  padding:6px 15px;cursor:pointer;white-space:nowrap;
}
.inlinebtn:hover{background:${$.ink}}
.seg.wide .segbtn{padding-left:14px;padding-right:14px}

.ledger{margin:4px 0 6px}
.lrow{
  display:grid;grid-template-columns:1fr auto;column-gap:20px;
  padding:13px 14px;border-radius:12px;align-items:center;
}
.lrow.sum{background:${$.uvSoft};margin-top:4px}
.lpath{grid-area:1/1;font-size:.98rem;font-weight:600;font-family:${wt}}
.mono.lpath{font-family:${ln};font-weight:400;font-size:.92rem}
.lnote{grid-area:2/1;font-size:.87rem;color:${$.mut};line-height:1.5;margin-top:3px}
.lval{grid-area:1/2/3/3;align-self:center;font-size:1.22rem;color:${$.ink}}
.tight{margin-top:14px}

/* junctions */
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 20px}
.jcard{background:${$.white};border-radius:14px;padding:14px 15px 16px}
.jsvg{width:100%;max-width:190px;display:block;margin:0 auto 4px}
.node.sm{font-size:14px}
.jcard h4{font-family:${wt};font-size:1rem;font-weight:600;margin:2px 0 1px;color:${$.ink}}
.jrole{font-size:.83rem;color:${$.faint};margin:0 0 9px;font-family:${wt}}
.jline{font-size:.87rem;line-height:1.5;margin:0 0 6px;color:${$.mut}}
.jline b{font-family:${wt};font-size:.76rem;letter-spacing:.03em;text-transform:uppercase;display:block;color:${$.ink}}
.jline.ok b{color:${$.good}}
.jline.warn b{color:${$.orange}}
.jstory{font-size:.85rem;line-height:1.5;color:${$.ink};margin:10px 0 0;opacity:.8}
.warnnote{background:${$.card};border-radius:12px;padding:15px 17px;font-size:.97rem;max-width:none}

/* glossary */
.gloss{display:grid;grid-template-columns:auto 1fr;column-gap:22px;row-gap:9px;margin:.2em 0 20px;align-items:baseline}
.gloss dt{font-family:${wt};font-weight:600;font-size:.93rem;color:${$.uv};white-space:nowrap}
.gloss dd{margin:0;font-size:.94rem;line-height:1.5;color:${$.mut}}

.foot{color:${$.faint};font-size:.82rem;font-family:${wt};margin-top:34px}

*:focus-visible{outline:2.5px solid ${$.uv};outline-offset:2px;border-radius:4px}

@media (max-width:720px){
  .jgrid{grid-template-columns:1fr}
  .jsvg{max-width:210px}
}
@media (max-width:520px){
  .wrap{font-size:16px;padding:0 16px 56px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .chartwrap{height:320px}
  .segbtn{min-width:calc(50% - 4px)}
  .seg.wide .segbtn{min-width:0;flex:1 1 auto}
  .gloss{grid-template-columns:1fr;row-gap:2px}
  .gloss dd{margin-bottom:11px}
  .lrow{padding:12px 10px}
  .lval{font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
